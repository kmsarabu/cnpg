image:
  repository: ghcr.io/cloudnative-pg/cloudnative-pg
  pullPolicy: IfNotPresent
  tag: "1.27.1"

podLabels:
  env: "dev"

resources:
  requests:
    cpu: "256m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "512Mi"

livenessProbe:
  timeoutSeconds: 5
  periodSeconds: 10
readinessProbe:
  timeoutSeconds: 5
  periodSeconds: 10
startupProbe:
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 30
